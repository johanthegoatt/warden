[package]
name = "warden-sensor"
version = "0.1.0"
edition = "2024"
description = "Probe loop, drift scoring, second-path verification and dashboard server for Warden"
license = "MIT"
publish = false

[[bin]]
name = "warden-sensor"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
ureq = { version = "3", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[profile.dev]
incremental = false
debug = 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.test]
incremental = false
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
strip = true
