name: sentinel

# Runs Warden's rescue path in the cloud, so paused sites come back while the PC is off.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel
  cancel-in-progress: false

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Probe, unpause, confirm
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python cloud/sentinel.py
